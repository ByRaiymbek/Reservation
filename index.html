  <body>
    <header>

        <section>

                <input type="name" id="name" required>

            <div> 
                <label for="number">Ваш номер телефона: </label>
                <input type="number" id="number" required>

                    </option>

            </div>
            <div> 
                
                <label for="place">Где сидеть: </label>
                |<div id="place">
                    <input type="radio" name="place" value="Zal">
                        зал
                    
                    <input type="radio" name="place" value="Terrasa">
                        терраса 
                    <input type="radio" name="place" value="Vip">
                        VIP-комната  
                </div>
                
            </div>
            <div> 
                <label for="wishes">Пожелания: </label>
                |<div id="wishes">
                    <input type="checkbox" name="wishes" value="KidChair">

                    </input>
                    <input type="checkbox" name="wishes" value="WindowChair">
                        столик у окна  
                    </input>
                    <input type="checkbox" name="wishes" value="Cake">
                        торт от кафе   
                    </input>
                </div>
            </div>
            <div> 
                <label for="comments">Ваше коментарий: </label>
                <input type="text" id="comments" required>
            </div>
            <div> 
                <label for="Accept">Согласие с правилами кафе: </label>
                <input type="radio" name="accept" id="accept" required>
                Да
            </div>
            </form>
        </b>
